version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: nest
      POSTGRES_PASSWORD: nest
      POSTGRES_DB: testdb
      POSTGRES_HOST_AUTH_METHOD: trust  # Temporal para diagnóstico
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: 
      - postgres 
      - -c 
      - listen_addresses=0.0.0.0
    healthcheck:
      test: 
        - CMD-SHELL
        - "pg_isready -U nest -d testdb -h 127.0.0.1"
      interval: 5s
      timeout: 10s
      retries: 15
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    environment:
      # --- IMPORTANT ADJUSTMENTS HERE ---
      DB_HOST: db # 'db' is the service name in docker-compose, which acts as the hostname
      DB_PORT: 5432
      DB_USERNAME: nest
      DB_PASSWORD: nest
      DB_NAME: testdb
      # ---------------------------------
      NODE_ENV: development
      TYPEORM_DEBUG: "true"
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge